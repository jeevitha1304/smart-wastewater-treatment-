{% extends 'base.html' %}{% block title %}New Sample{% endblock %}{% block content %}<div class="heading"><span class="eyebrow">STEP 1</span><h1>Register wastewater sample</h1><p>Enter sample details before laboratory measurements.</p></div><form method="post" class="panel grid"><label>Sample ID<input name="sample_code" required placeholder="e.g. WW-001"></label><label>Sample source<select name="source" required><option value="">Select source</option><option>Industrial Wastewater</option><option>Domestic Wastewater</option><option>Commercial Wastewater</option><option>Laboratory Sample</option><option>Other</option></select></label><label>Collection date<input type="date" name="collection_date" value="{{ today }}" required></label><label class="wide">Notes (optional)<textarea name="notes" rows="3" placeholder="Location or observations"></textarea></label><div class="wide actions"><a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn primary">Save & Enter Lab Results →</button></div></form>{% endblock %}
